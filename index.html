<style>

}
/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:50; background:rgba(16,24,39,.84);

.top h1{font-size:17px; font-weight:800; letter-spacing:.3px; flex:1; background:linear-gradient(100deg,#fff 20%,#a9baff); -webkit-background-clip:text; background-clip:text; color:transparent}
.brandmark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:10px;font-weight:900;letter-spacing:-.4px;box-shadow:0 5px 16px var(--glow)}
.brandcopy{flex:1;min-width:0}.brandcopy h1{line-height:1.1}.brandcopy small{display:block;color:var(--faint);font-size:9px;font-weight:700;letter-spacing:.45px;margin-top:3px}
.clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--now);flex:none}
.dot.stale{background:var(--soon)}
.dot.err{background:var(--kmb)}
.iconbtn{

  width:34px;height:34px;border-radius:10px; font-size:15px; cursor:pointer;

}
.iconbtn:active{background:#2a3240}

.board{padding:12px 12px 0; display:flex; flex-direction:column; gap:10px}
.card{
  background:linear-gradient(135deg,rgba(29,41,63,.94),rgba(20,29,46,.94)); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 28px rgba(3,8,20,.18);
  overflow:hidden; position:relative;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
.card[data-co=KMB]::before{background:var(--kmb)}
.card[data-co=CTB]::before{background:var(--ctb)}
.card[data-co=GMB]::before{background:var(--gmb)}
.chead{display:flex; align-items:baseline; gap:8px; padding:11px 13px 8px 15px}
.rt{font-size:25px; font-weight:800; letter-spacing:-.5px; line-height:1}
.co{
  font-size:9px; font-weight:800; padding:2px 5px; border-radius:4px;
  letter-spacing:.5px; flex:none; transform:translateY(-2px);
}
.co.KMB{background:rgba(226,35,26,.16); color:#ff8079}
.co.CTB{background:rgba(245,166,35,.16); color:#ffc165}
.co.GMB{background:rgba(78,192,110,.16); color:#7fd897}
.dest{font-size:12.5px; color:var(--dim); flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:right}
.stop{
  padding:0 13px 9px 15px; font-size:11.5px; color:var(--faint);
  display:flex; align-items:center; gap:5px;
}
.stop b{color:var(--dim); font-weight:600}.fare{margin-left:auto;color:#ffd166;font-size:10.5px;font-weight:800;white-space:nowrap;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.2);padding:3px 6px;border-radius:6px}
/* ---------- eta row ---------- */
.etas{display:flex; gap:7px; padding:0 13px 12px 15px; overflow-x:auto; scrollbar-width:none}
.etas::-webkit-scrollbar{display:none}
.eta{

.eta .m{font-size:21px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums}
.eta .u{font-size:9.5px; color:var(--faint); font-weight:600}
.eta .t{font-size:9.5px; color:var(--faint); margin-top:2px; font-variant-numeric:tabular-nums}
.eta.i0{border-color:rgba(0,229,138,.4); background:rgba(0,229,138,.08)}
.eta.i0 .m{color:var(--now)}
.eta.i1 .m{color:var(--soon)}
.eta.i2 .m{color:var(--late)}
.eta.arr{border-color:rgba(0,229,138,.55); background:rgba(0,229,138,.14)}

.eta.sch{opacity:.62}

  資料來源：data.gov.hk 實時到站 API<br>
  到站時間僅供參考，實際班次可能有變

<script>
'use strict';
/* ===================================================================
   巴士到站牌 — 三間公司 API adapter
   KMB : data.etabus.gov.hk/v1
   CTB : rt.data.gov.hk/v2/transport/citybus   (新巴已併入 CTB)
   GMB : data.etagmb.gov.hk                   (綠色專線小巴)
   =================================================================== */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const GMB = 'https://data.etagmb.gov.hk';

const CO_NAME = { KMB:'九巴', CTB:'城巴', GMB:'小巴' };
const REGION  = { HKI:'港島', KLN:'九龍', NT:'新界' };

/* ---- fetch with timeout + JSON ---- */
async function getJSON(url, ms = 12000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---- in-memory cache for static data (routes / stop names) ---- */
const memo = new Map();
function cached(key, fn) {
  if (!memo.has(key)) memo.set(key, fn().catch(e => { memo.delete(key); throw e; }));
  return memo.get(key);
}

/* =========================  ROUTE SEARCH  ========================= */
/* Returns array of variant objects, normalised across companies:
   { co, route, dirLabel, origin, dest, ...co-specific keys }        */

async function searchKMB(route) {
  const all = (await cached('kmb:routes', () => getJSON(KMB + '/route/'))).data;
  const R = route.toUpperCase();
  return all.filter(r => r.route.toUpperCase().startsWith(R)).map(r => ({
    co: 'KMB', route: r.route,
    bound: r.bound === 'O' ? 'outbound' : 'inbound',
    dir: r.bound, service_type: r.service_type,
    origin: r.orig_tc, dest: r.dest_tc,
    dirLabel: r.orig_tc + ' → ' + r.dest_tc,
    extra: r.service_type !== '1' ? '特別班次 ' + r.service_type : ''
  }));
}

async function searchCTBExact(route) {
  const R = route.toUpperCase();
  let info;
  try { info = (await getJSON(CTB + '/route/CTB/' + encodeURIComponent(R))).data; }
  catch { return []; }
  if (!info || !info.route) return [];
  const out = [];
  for (const b of ['inbound', 'outbound']) {
    let stops = [];
    try { stops = (await getJSON(CTB + '/route-stop/CTB/' + encodeURIComponent(R) + '/' + b)).data || []; }
    catch { continue; }
    if (!stops.length) continue;
    const fwd = b === 'outbound';
    out.push({
      co: 'CTB', route: info.route, bound: b, dir: fwd ? 'O' : 'I',
      origin: fwd ? info.orig_tc : info.dest_tc,
      dest:   fwd ? info.dest_tc : info.orig_tc,
      dirLabel: (fwd ? info.orig_tc : info.dest_tc) + ' → ' + (fwd ? info.dest_tc : info.orig_tc),
      extra: ''
    });
  }
  return out;
}

async function searchCTB(route) {
  const R = route.toUpperCase();
  let all = [];
  try { all = (await getJSON(CTB + '/route/CTB')).data || []; } catch { return []; }
  const matches = [...new Set(all.map(x => x.route).filter(x => x.toUpperCase().startsWith(R)))];
  const results = await Promise.all(matches.slice(0, 25).map(searchCTBExact));
  return results.flat();
}

async function searchGMB(route) {
  const R = route.toUpperCase();
  const out = [];
  for (const rg of ['HKI', 'KLN', 'NT']) {
    let codes = [];
    try { codes = (await getJSON(GMB + '/route/' + rg)).data?.routes || []; } catch { continue; }
    const matches = codes.filter(code => code.toUpperCase().startsWith(R)).slice(0, 25);
    for (const code of matches) {
      let rows;
      try { rows = (await getJSON(GMB + '/route/' + rg + '/' + encodeURIComponent(code))).data; } catch { continue; }
      for (const r of (rows || [])) {
        for (const d of (r.directions || [])) {
          out.push({
            co: 'GMB', route: r.route_code, region: r.region,
            route_id: r.route_id, route_seq: d.route_seq,
            origin: d.orig_tc, dest: d.dest_tc,
            dirLabel: d.orig_tc + ' → ' + d.dest_tc,
            extra: REGION[r.region] + (r.description_tc && r.description_tc !== '正常班次' ? ' · ' + r.description_tc : '')
          });
        }
      }
    }
  }
  return out;
}

function searchRoute(co, route) {
  if (co === 'KMB') return searchKMB(route);
  if (co === 'CTB') return searchCTB(route);
  return searchGMB(route);
}

/* =========================  STOP LIST  ========================= */
/* Returns [{ seq, id, name }] for a chosen route variant */

async function stopsKMB(v) {
  const rs = (await getJSON(
    KMB + '/route-stop/' + encodeURIComponent(v.route) + '/' + v.bound + '/' + v.service_type
  )).data;
  const names = await cached('kmb:stops', () => getJSON(KMB + '/stop').then(d => {
    const m = new Map(); d.data.forEach(s => m.set(s.stop, { name: s.name_tc, lat: +s.lat, lng: +s.long })); return m;
  }));
  return rs.map(s => { const info = names.get(s.stop) || {}; return { seq: +s.seq, id: s.stop, name: info.name || s.stop, lat: info.lat, lng: info.lng }; });
}

async function stopsCTB(v) {
  const rs = (await getJSON(
    CTB + '/route-stop/CTB/' + encodeURIComponent(v.route) + '/' + v.bound
  )).data;
  const out = await Promise.all(rs.map(async s => {
    let nm = s.stop, lat, lng;
    try {
      const info = (await cached('ctb:stop:' + s.stop, () => getJSON(CTB + '/stop/' + s.stop))).data || {};
      nm = info.name_tc || s.stop; lat = +(info.lat || info.latitude); lng = +(info.long || info.lng || info.longitude);
    } catch {}
    return { seq: +s.seq, id: s.stop, name: nm, lat, lng };
  }));
  return out;
}

async function stopsGMB(v) {
  const d = (await getJSON(GMB + '/route-stop/' + v.route_id + '/' + v.route_seq)).data;
  return (d.route_stops || []).map(s => ({
    seq: +s.stop_seq, id: String(s.stop_id), name: s.name_tc,
    lat: +(s.lat || s.latitude), lng: +(s.long || s.lng || s.longitude)
  }));
}

function routeStops(v) {
  if (v.co === 'KMB') return stopsKMB(v);
  if (v.co === 'CTB') return stopsCTB(v);
  return stopsGMB(v);
}

/* =========================  ETA  ========================= */
/* Returns { etas:[{iso, min, rmk, sched}], err } — sorted, future only */

function minsFrom(iso) {
  return Math.round((new Date(iso).getTime() - Date.now()) / 60000);
}

async function etaKMB(it) {
  const d = (await getJSON(
    KMB + '/route-eta/' + encodeURIComponent(it.route) + '/' + it.service_type
  )).data;
  return d.filter(e =>
      e.seq === it.seq && e.dir === it.dir && e.eta
    ).map(e => ({
      iso: e.eta, min: minsFrom(e.eta),
      rmk: e.rmk_tc || '', sched: /原定|預定|Scheduled/i.test(e.rmk_tc || '')
    }));
}

async function etaCTB(it) {
  const d = (await getJSON(
    CTB + '/eta/CTB/' + it.stopId + '/' + encodeURIComponent(it.route)
  )).data;
  return (d || []).filter(e => e.eta && e.dir === it.dir).map(e => ({
    iso: e.eta, min: minsFrom(e.eta),
    rmk: e.rmk_tc || '', sched: /原定|預定|Scheduled/i.test(e.rmk_tc || '')
  }));
}

async function etaGMB(it) {
  const d = (await getJSON(
    GMB + '/eta/route-stop/' + it.route_id + '/' + it.route_seq + '/' + it.seq
  )).data;
  const rows = Array.isArray(d) ? (d[0] ? d[0].eta : []) : (d.eta || []);
  return (rows || []).filter(e => e.timestamp).map(e => ({
    iso: e.timestamp, min: e.diff != null ? Math.round(e.diff) : minsFrom(e.timestamp),
    rmk: e.remarks_tc || '', sched: false
  }));
}

async function fetchETA(it) {
  try {
    let list = it.co === 'KMB' ? await etaKMB(it)
             : it.co === 'CTB' ? await etaCTB(it)
             : await etaGMB(it);
    list = list.filter(e => e.min >= -2).sort((a, b) => a.min - b.min).slice(0, 4);
    return { etas: list, err: null };
  } catch (e) {
    return { etas: [], err: e.name === 'AbortError' ? '連線超時' : '讀取失敗' };
  }
}

async function roadPath(stops) {
  const valid = stops.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));

  try {
    const coords = valid.map(x => x.lng + ',' + x.lat).join(';');
    const d = await getJSON('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=false', 15000);
    const line = d.routes?.[0]?.geometry?.coordinates || [];
    if (line.length > 1) return line.map(x => [x[1], x[0]]);
  } catch {}
  return valid.map(x => [x.lat, x.lng]);
}

let setupMapInstance = null;

function nearestStop(stops, lat, lng) {
  return stops.reduce((best, st) => {
    const d = Math.pow(st.lat - lat, 2) + Math.pow(st.lng - lng, 2);
    return !best || d < best.d ? { st, d } : best;
  }, null)?.st;
}

function locateOnMap(map, stops, button) {
  if (!navigator.geolocation) { button.textContent = '此瀏覽器不支援定位'; return; }
  button.textContent = '⌖ 定位中…';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (window.__userMarker) window.__userMarker.remove();
    window.__userMarker = L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#ff625c', fillOpacity: .95 }).addTo(map).bindPopup('<b>你目前位置</b>').openPopup();
    map.setView([lat, lng], 17);
    const near = nearestStop(stops, lat, lng);
    if (near) map.eachLayer(layer => { if (layer.getLatLng && Math.abs(layer.getLatLng().lat-near.lat)<1e-8 && Math.abs(layer.getLatLng().lng-near.lng)<1e-8) layer.openPopup(); });
    button.textContent = '⌖ 已定位到附近';
  }, () => { button.textContent = '⌖ 定位失敗，請允許 GPS'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}

function locateOnExistingMap(it) {
  const map = mapCache.get(uid(it));
  if (!map) return;
  routeStops(it).then(stops => locateOnMap(map, stops.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng)), board.querySelector('[data-locate-id="' + cssEscape(uid(it)) + '"]')));
}

function paint(it, res) {
  const slot = board.querySelector('[data-slot="' + cssEscape(uid(it)) + '"]');
  if (!slot) return;
  const card = slot.closest('.card');
  const old = card.querySelector('.rmk, .none');
  if (old) old.remove();

  if (res.err) {
    slot.innerHTML = '<div class="eta"><div class="m" style="font-size:14px;color:var(--faint)">—</div>' +
                     '<div class="u">' + esc(res.err) + '</div></div>';
    return;
  }
  if (!res.etas.length) {
    slot.innerHTML = '';
    card.insertAdjacentHTML('beforeend', '<div class="none">暫時冇班次資料（可能已收車）</div>');
    return;
  }
  slot.innerHTML = res.etas.map((e, i) => {
    const hhmm = new Date(e.iso).toLocaleTimeString('en-GB',
      { hour:'2-digit', minute:'2-digit', hour12:false });
    const cls = ['eta', 'i' + Math.min(i, 2)];
    if (e.sched) cls.push('sch');
    let big;
    if (e.min <= 0) { cls.push('arr'); big = '<div class="m">即將到達</div><div class="u">&nbsp;</div>'; }
    else            { big = '<div class="m">' + e.min + '</div><div class="u">分鐘</div>'; }
    return '<div class="' + cls.join(' ') + '">' + big +
           '<div class="t">' + hhmm + '</div></div>';
  }).join('');

  const rmks = [...new Set(res.etas.map(e => e.rmk).filter(Boolean))];
  if (rmks.length) {
    card.insertAdjacentHTML('beforeend',
      '<div class="rmk">' + rmks.map(r => '<span>&#9432; ' + esc(r) + '</span>').join('') + '</div>');
  }
}

async function refresh() {
  if (inFlight || !items.length) return;
  inFlight = true;
  dot.className = 'dot';
  const snapshot = items.slice();
  const results = await Promise.all(snapshot.map(fetchETA));
  snapshot.forEach((it, i) => {
    if (items.some(x => uid(x) === uid(it))) { latestResults.set(uid(it), results[i]); paint(it, results[i]); checkAlarms(it, results[i]); }
  renderPip();
  });
  const anyOK = results.some(r => !r.err);
  if (anyOK) lastOK = Date.now();
  dot.className = 'dot' + (anyOK ? '' : ' err');
  inFlight = false;
}

/* clock + staleness indicator */
setInterval(() => {
  clock.textContent = new Date().toLocaleTimeString('en-GB', { hour12:prefs.time12 });
  if (lastOK && Date.now() - lastOK > 75000 && !inFlight) dot.className = 'dot stale';
}, 1000);

/* auto refresh every 25s, pause when tab hidden, resume on focus */
let timer = null;
function startLoop() {
  stopLoop();
  refresh();
  timer = setInterval(refresh, 25000);
}
function stopLoop() { if (timer) { clearInterval(timer); timer = null; } }

document.addEventListener('visibilitychange', () => {
  // 不要因為切去音樂／聊天 App 就停止提醒；回到前景時立即補一次更新。
  if (!document.hidden) refresh();
});
$('#refreshBtn').addEventListener('click', () => { refresh(); });
/* ===================================================================
   SETTINGS SHEET
   =================================================================== */
const mask = $('#mask'), sheet = $('#sheet'), sBody = $('#sBody'), sTitle = $('#sTitle');
let pickCo = 'KMB';

function openSheet() { mask.classList.add('on'); sheet.classList.add('on'); }
function closeSheet() { mask.classList.remove('on'); sheet.classList.remove('on'); }
mask.addEventListener('click', closeSheet);
$('#closeBtn').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', () => { viewHome(); openSheet(); });
$('#prefsBtn').addEventListener('click', () => { viewPrefs(); openSheet(); });

function viewPrefs() {
  sTitle.textContent = '顯示與提醒設定';
  sBody.innerHTML =
  '<div class="lbl">到站／落車提醒</div>' +
    '<div class="pref-row"><div>提早幾多分鐘響鬧<small>揀咗路線卡上方嘅 🔔 後生效；卡片所選站頭就係提醒目標站</small></div><select class="pref-select" id="leadSel"><option value="1">1 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option></select></div>' +
    '<button class="wide" id="notifyBtn">允許系統通知</button>' +
    '<button class="wide" id="miniBtn">▣ 開啟最上層小窗</button>' +
    '<div class="hint">小窗會顯示簡化 ETA，讓你可以一邊聽音樂一邊睇巴士；手機瀏覽器若不支援，請使用 Android 分割畫面。</div>' +
    '<div class="lbl">外觀</div>' +
    '<div class="pref-row"><div>字體大小<small>只影響主畫面閱讀大小</small></div><select class="pref-select" id="fontSel"><option value="normal">標準</option><option value="large">較大</option></select></div>' +
    '<div class="pref-row"><div>時間顯示<small>ETA 卡片時間及頂部時鐘</small></div><select class="pref-select" id="timeSel"><option value="false">24 小時制</option><option value="true">12 小時制</option></select></div>' +
    '<div class="pref-row"><div>顏色模式<small>可以選擇黑暗或光明版</small></div><select class="pref-select" id="themeSel"><option value="dark">黑暗模式</option><option value="light">光明模式</option></select></div>' +
    '<button class="wide" id="prefsBack">← 返回路線設定</button>';
  $('#leadSel').value = String(prefs.lead); $('#fontSel').value = prefs.font; $('#timeSel').value = String(prefs.time12); $('#themeSel').value = prefs.theme;
  $('#leadSel').addEventListener('change', e => { prefs.lead=+e.target.value; savePrefs(); });
  $('#fontSel').addEventListener('change', e => { prefs.font=e.target.value; savePrefs(); applyPrefs(); });
  $('#timeSel').addEventListener('change', e => { prefs.time12=e.target.value === 'true'; savePrefs(); });
  $('#themeSel').addEventListener('change', e => { prefs.theme=e.target.value; savePrefs(); applyPrefs(); });
  $('#notifyBtn').addEventListener('click', async e => { await requestNotifications(); e.currentTarget.textContent = ('Notification' in window && Notification.permission === 'granted') ? '系統通知已允許' : '未能允許系統通知'; });
  $('#miniBtn').addEventListener('click', e => openMiniWindow(e.currentTarget));
  $('#prefsBack').addEventListener('click', viewHome);
}

/* ---------- view 1: home (saved list + add) ---------- */
function viewHome() {
  sTitle.textContent = '設定路線';
  let h = '<div class="lbl">我嘅路線牌（' + items.length + '）</div>';
  if (!items.length) {
    h += '<div class="msg">仲未加任何路線</div>';
  } else {
    h += '<div class="list">' + items.map((it, i) =>
      '<div class="sv">' +
        '<span class="tag ' + it.co + '">' + CO_NAME[it.co] + '</span>' +
        '<span class="n">' + esc(it.route) + '</span>' +
        '<span class="d">' + esc(it.stopName) + '<br>往 ' + esc(it.dest || '') + '</span>' +
        '<button class="mv" data-up="' + i + '" ' + (i === 0 ? 'disabled style="opacity:.25"' : '') + '>&#9650;</button>' +
        '<button class="mv" data-dn="' + i + '" ' + (i === items.length - 1 ? 'disabled style="opacity:.25"' : '') + '>&#9660;</button>' +
        '<button class="x" data-del="' + i + '">&times;</button>' +
      '</div>').join('') + '</div>';
  }
  h += '<button class="wide p" id="addBtn">＋ 加新路線</button>';
  h += '<div class="lbl">其他</div>';
  h += '<button class="wide" id="installBtn" style="display:none">&#128241; 安裝到主畫面</button>';
  h += '<button class="wide" id="resetBtn">回復預設路線</button>';
  h += '<div class="hint">設定會存喺呢部機嘅瀏覽器，下次開返一樣。</div>';
  sBody.innerHTML = h;
  sBody.scrollTop = 0;

  sBody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    items.splice(+b.dataset.del, 1); save(); shell(); refresh(); viewHome();
  }));
  sBody.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.up; if (i < 1) return;
    [items[i-1], items[i]] = [items[i], items[i-1]];
    save(); shell(); refresh(); viewHome();
  }));
  sBody.querySelectorAll('[data-dn]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.dn; if (i >= items.length - 1) return;
    [items[i+1], items[i]] = [items[i], items[i+1]];
    save(); shell(); refresh(); viewHome();
  }));
  $('#addBtn').addEventListener('click', viewSearch);
  $('#resetBtn').addEventListener('click', () => {
    items = DEFAULTS.slice(); save(); shell(); refresh(); viewHome();
  });
  if (deferredPrompt) {
    const ib = $('#installBtn');
    ib.style.display = 'block';
    ib.addEventListener('click', doInstall);
  }
}

/* ---------- view 2: search route number ---------- */
function viewSearch() {
  sTitle.textContent = '加新路線';
  sBody.innerHTML =
    '<div class="lbl">巴士公司</div>' +
    '<div class="segs" id="segs">' +
      ['KMB','CTB','GMB'].map(c =>
        '<button class="seg' + (c === pickCo ? ' on' : '') + '" data-co="' + c + '">' +
        (c === 'KMB' ? '九巴／龍運' : c === 'CTB' ? '城巴／新巴' : '綠色小巴') +
        '</button>').join('') +
    '</div>' +
    '<div class="lbl">路線號碼</div>' +
    '<input class="tin" id="rIn" placeholder="例如 1A、89、往 108…" autocomplete="off" ' +
      'autocapitalize="characters" enterkeyhint="search">' +
    '<div class="hint" id="rHint">輸入號碼然後揿「搵路線」。小巴只有綠色專線小巴有實時數據。</div>' +
    '<button class="wide p" id="goBtn">搵路線</button>' +
    '<div id="rOut"></div>' +
    '<button class="wide" id="backBtn">← 返回</button>';
  sBody.scrollTop = 0;

  sBody.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
    pickCo = b.dataset.co;
    sBody.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
    $('#rOut').innerHTML = '';
  }));
  $('#backBtn').addEventListener('click', viewHome);
  const inp = $('#rIn');
  $('#goBtn').addEventListener('click', () => doSearch(inp.value.trim()));
  let searchTimer;
  inp.addEventListener('input', () => { clearTimeout(searchTimer); const q = inp.value.trim(); if (!q) { $('#rOut').innerHTML = ''; return; } searchTimer = setTimeout(() => doSearch(q), 380); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(inp.value.trim()); } });
  setTimeout(() => inp.focus(), 260);
}

async function doSearch(q) {
  const out = $('#rOut');
  if (!q) { out.innerHTML = '<div class="msg">請輸入路線號碼</div>'; return; }
  out.innerHTML = '<div class="msg"><span class="spin"></span>搵緊 ' + esc(q) + ' …</div>';
  let vs = [];
  try { vs = await searchRoute(pickCo, q); }
  catch { out.innerHTML = '<div class="msg">讀取失敗，請檢查網絡再試</div>'; return; }
  vs.sort((a, b) => (a.dirLabel || '').localeCompare(b.dirLabel || '', 'zh-HK'));
  if (!vs.length) {
    out.innerHTML = '<div class="msg">搵唔到 <b>' + esc(q.toUpperCase()) + '</b><br>' +
      '睇下係唔係揀錯公司，或者號碼有冇打錯</div>';
    return;
  }
  window.__vs = vs;
  out.innerHTML = '<div class="lbl">揀方向（' + vs.length + '）</div><div class="list">' +
    vs.map((v, i) =>
      '<button class="li" data-v="' + i + '">' +
        '<span class="n">' + esc(v.route) + '</span>' +
        '<span class="d">' + esc(v.dirLabel) +
          (v.extra ? '<s>' + esc(v.extra) + '</s>' : '') + '</span>' +
        '<span class="a">›</span>' +
      '</button>').join('') + '</div>';
  out.querySelectorAll('[data-v]').forEach(b =>
    b.addEventListener('click', () => viewStops(window.__vs[+b.dataset.v])));
}

/* ---------- view 3: pick stop ---------- */
async function viewStops(v) {
  sTitle.textContent = v.route + ' — 揀站頭';
  sBody.innerHTML = '<div class="msg"><span class="spin"></span>載入站頭 …</div>';
  sBody.scrollTop = 0;
  let stops;
  try { stops = await routeStops(v); }
  catch {
    sBody.innerHTML = '<div class="msg">站頭讀取失敗</div>' +
      '<button class="wide" id="bk">← 返回</button>';
    $('#bk').addEventListener('click', viewSearch);
    return;
  }
  setupMapInstance = null;
  sBody.innerHTML =
    '<div class="lbl">' + esc(v.dirLabel) + '</div>' +
    '<div class="map-actions" style="padding:0 0 10px"><button class="map-toggle" id="setupMapBtn"><span>🗺 先睇全條路線地圖</span><span class="map-arrow">⌄</span></button></div>' +
    '<div class="map-wrap" id="setupMapWrap"><div class="map-tools"><button class="locate-btn" id="locateBtn">⌖ 定位我附近</button></div><div class="route-map"></div><div class="map-note">藍線按道路網絡模擬，撳任何站點可以睇站名。</div></div>' +
    '<div class="hint" style="margin:0 0 10px">睇完地圖後，揀你上車嗰個站（' + stops.length + ' 個）</div>' +
    '<div class="list">' + stops.map((s, i) =>
      '<button class="li sm" data-s="' + i + '">' +
        '<span class="n">' + s.seq + '</span>' +
        '<span class="d">' + esc(s.name) + '</span>' +
        '<span class="a">＋</span>' +
      '</button>').join('') + '</div>' +
    '<button class="wide" id="bk">← 返回</button>';
  $('#setupMapBtn').addEventListener('click', () => showSetupMap(v, stops, $('#setupMapBtn')));
  $('#bk').addEventListener('click', viewSearch);
  sBody.querySelectorAll('[data-s]').forEach(b =>
    b.addEventListener('click', () => addItem(v, stops[+b.dataset.s])));
}

function addItem(v, s) {
  const it = v.co === 'GMB'
    ? { co:'GMB', route:v.route, region:v.region, route_id:v.route_id,
        route_seq:v.route_seq, seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : v.co === 'KMB'
    ? { co:'KMB', route:v.route, bound:v.bound, dir:v.dir, service_type:v.service_type,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : { co:'CTB', route:v.route, bound:v.bound, dir:v.dir,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest };
  if (items.some(x => uid(x) === uid(it))) { viewHome(); return; }
  items.push(it); save(); shell(); refresh(); viewHome();
}

/* ===================================================================
   PWA INSTALL
   =================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
}

   BOOT
   =================================================================== */
shell();
startLoop();
</script>
